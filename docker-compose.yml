services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: havana
      POSTGRES_PASSWORD: havana
      POSTGRES_DB: havana
    ports:
      - '5432:5432'
    volumes:
      - havana_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U havana']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  havana_data:
