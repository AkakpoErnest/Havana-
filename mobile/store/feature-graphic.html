<!doctype html>
<!-- Source for the Play Store feature graphic (1024×500). Render: headless Chrome screenshot at 1024×500. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1024px;height:500px;overflow:hidden}
  body{background:#23206B;font-family:'Bricolage Grotesque',sans-serif;color:#fff;position:relative}
  .wrap{position:absolute;left:72px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:14px}
  .logo{font-size:104px;font-weight:700;letter-spacing:-4px;line-height:1}
  .logo span{color:#F0437B}
  .tag{font-size:17px;font-weight:700;letter-spacing:5px;color:#1FA774;text-transform:uppercase}
  .line{font-size:32px;font-weight:700;line-height:1.2;max-width:470px}
  .sub{font-size:22px;font-weight:500;color:#C9C8EA}
  .card{position:absolute;width:210px;height:290px;border-radius:26px;background:#fff;box-shadow:0 30px 60px rgba(0,0,0,.35);overflow:hidden}
  .card .ph{height:200px}
  .card b{display:block;font-size:24px;color:#23206B;padding:14px 18px 0}
  .card i{display:block;font-style:normal;font-size:16px;color:#6B6A86;padding:4px 18px}
  .c1{right:215px;top:120px;transform:rotate(-8deg)}
  .c1 .ph{background:linear-gradient(135deg,#FFB020,#F0437B)}
  .c2{right:40px;top:90px;transform:rotate(6deg)}
  .c2 .ph{background:linear-gradient(135deg,#1FA774,#23206B)}
  .tagp{position:absolute;right:28px;top:46px;background:#FFB020;color:#16152E;font-weight:700;font-size:24px;padding:10px 18px;border-radius:12px;transform:rotate(6deg)}
</style></head><body>
<div class="wrap">
  <div class="tag">Africa's second-hand sweet spot</div>
  <div class="logo">havana<span>.</span></div>
  <div class="line">Buy it. Haggle a little.<br>Swap for something you love.</div>
  <div class="sub">Ghana · Nigeria · Kenya</div>
</div>
<div class="card c1"><div class="ph"></div><b>KSh 3,500</b><i>Westlands · 2 km</i></div>
<div class="card c2"><div class="ph"></div><b>GH₵850</b><i>Osu · 5 km</i></div>
<div class="tagp">♥ Want it</div>
</body></html>
