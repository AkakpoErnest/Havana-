# Render's free plan puts the API to sleep after 15 minutes without traffic, and the next person to open
# the app waits ~1 minute on "Connecting to Havana…". Pinging /health every 10 minutes keeps it awake.
# GitHub may start scheduled runs a few minutes late; that's fine for this.
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl --fail --silent --show-error --max-time 120 --retry 2 https://havana-api.onrender.com/health
