# Render Blueprint for the Havana API (free plan).
# Render dashboard → New → Blueprint → pick this repo. It asks for the secret values marked sync:false.
services:
  - type: web
    name: havana-api
    runtime: node
    plan: free            # sleeps after 15 min idle (~30-60s wake-up); switch to "starter" for real users
    region: frankfurt     # closest Render region to Ghana
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run start:prod   # applies pending migrations, then starts the API
    healthCheckPath: /health
    autoDeploy: true      # every push to main redeploys
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      # Production never returns development codes; configure real email delivery before login is available.
      - key: DEV_OTP
        value: "false"
      - key: BREVO_API_KEY
        sync: false
      - key: OTP_EMAIL_FROM
        sync: false
      - key: DATABASE_URL       # Neon pooled connection string
        sync: false
      - key: DIRECT_URL         # Neon direct connection string (migrations)
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: havana-photos
      - key: R2_PUBLIC_URL      # https://pub-xxxx.r2.dev
        sync: false

  # Havana website (landing page). Free static site; no server, never sleeps.
  - type: web
    name: havana-web
    runtime: static
    rootDir: website
    buildCommand: echo "static site, nothing to build"
    staticPublishPath: .
    autoDeploy: true
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800

  # Havana web app: the same Expo app as the APK, built for browsers, so people without Android
  # (iPhone, laptop) can sign in. Free static site; talks to havana-api like the phone app.
  - type: web
    name: havana-app
    runtime: static
    rootDir: mobile
    buildCommand: npm ci && npx expo export --platform web --output-dir dist
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: EXPO_PUBLIC_API_URL
        value: https://havana-api.onrender.com
      - key: EXPO_NO_TELEMETRY
        value: "1"
    routes:
      # Single-page app: every path (e.g. /chat/123 after a reload) loads index.html and the router takes over.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /_expo/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
